---
name: Sync GitHub Wiki

'on':
  push:
    branches:
      - main
    paths:
      - wiki/**
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync wiki directory
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Publish wiki
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WIKI_REPOSITORY: ${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail

          if [[ ! -f wiki/Home.md ]]; then
            echo "::error::The wiki source must contain wiki/Home.md."
            exit 1
          fi

          wiki_dir="${RUNNER_TEMP}/wiki-repository"
          wiki_url="https://github.com/${WIKI_REPOSITORY}"
          source_sha="$(git rev-parse HEAD)"
          auth_header="$(
            printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 --wrap=0
          )"
          echo "::add-mask::${auth_header}"
          auth_key='http.https://github.com/.extraheader'
          git_auth=(
            -c
            "${auth_key}=AUTHORIZATION: basic ${auth_header}"
          )

          git "${git_auth[@]}" clone "${wiki_url}" "${wiki_dir}"
          wiki_branch="$(git -C "${wiki_dir}" branch --show-current)"
          if [[ -z "${wiki_branch}" ]]; then
            echo "::error::Wiki repository has no checked-out default branch."
            exit 1
          fi

          rsync --archive --delete --exclude='.git/' wiki/ "${wiki_dir}/"

          git -C "${wiki_dir}" add --all
          git -C "${wiki_dir}" diff --cached --check

          if git -C "${wiki_dir}" diff --cached --quiet; then
            echo "GitHub Wiki is already synchronized."
          else
            git -C "${wiki_dir}" config user.name "github-actions[bot]"
            git -C "${wiki_dir}" config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git -C "${wiki_dir}" commit -m "Sync wiki from ${source_sha}"
            git -C "${wiki_dir}" "${git_auth[@]}" push \
              origin "HEAD:${wiki_branch}"
          fi

          local_sha="$(git -C "${wiki_dir}" rev-parse HEAD)"
          remote_sha="$(
            git -C "${wiki_dir}" "${git_auth[@]}" ls-remote \
              origin "refs/heads/${wiki_branch}" | awk 'NR == 1 { print $1 }'
          )"
          if [[ -z "${remote_sha}" || "${local_sha}" != "${remote_sha}" ]]; then
            echo "::error::Wiki remote SHA does not match the local commit."
            exit 1
          fi

          echo "GitHub Wiki is synchronized at ${remote_sha}."
